<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Library</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('contact_library_settings');
          var storedDark = localStorage.getItem('contact_library_dark_mode');
          var isDark = storedDark === null ? true : storedDark === 'true';
          var root = document.documentElement;
          if (isDark) root.classList.add('dark');

          if (saved) {
            var parsed = JSON.parse(saved);
            var map = isDark
              ? {
                  blue: { hex: '#a4c1ff', on: '#282c35' },
                  purple: { hex: '#e6abff', on: '#322935' },
                  pink: { hex: '#ffaaae', on: '#372829' },
                  red: { hex: '#ffaca1', on: '#372927' },
                  burgundy: { hex: '#D67A87', on: '#221415' },
                  orange: { hex: '#ffb062', on: '#37291d' },
                  green: { hex: '#4ddb6a', on: '#242f23' },
                  forest: { hex: '#6EB396', on: '#141d19' },
                  coffee: { hex: '#e3b7a9', on: '#322a28' },
                  graphite: { hex: '#c1c0c6', on: '#2c2c2d' }
                }
              : {
                  blue: { hex: '#0056b8', on: '#ffffff' },
                  purple: { hex: '#8827b7', on: '#ffffff' },
                  pink: { hex: '#b60033', on: '#ffffff' },
                  red: { hex: '#b70008', on: '#ffffff' },
                  burgundy: { hex: '#7A1F2B', on: '#ffffff' },
                  orange: { hex: '#864b00', on: '#ffffff' },
                  green: { hex: '#006825', on: '#ffffff' },
                  forest: { hex: '#1E5641', on: '#ffffff' },
                  coffee: { hex: '#735246', on: '#ffffff' },
                  graphite: { hex: '#59595e', on: '#ffffff' }
                };
            var entry = map[parsed.accentColor] || map.blue;
            var hex = entry.hex;
            var clean = hex.replace('#', '');
            var r = parseInt(clean.substring(0, 2), 16);
            var g = parseInt(clean.substring(2, 4), 16);
            var b = parseInt(clean.substring(4, 6), 16);
            var rgb = r + ', ' + g + ', ' + b;
            root.style.setProperty('--macos-accent-color', hex);
            root.style.setProperty('--macos-accent-color-rgb', rgb);
            root.style.setProperty('--macos-on-accent', entry.on);
            root.style.setProperty('--macos-accent-tint', 'rgba(' + rgb + ', ' + (isDark ? '0.16' : '0.12') + ')');
            root.style.setProperty('--macos-accent-tint-subtle', 'rgba(' + rgb + ', ' + (isDark ? '0.12' : '0.08') + ')');
            root.style.setProperty('--macos-accent-tint-status', 'rgba(' + rgb + ', ' + (isDark ? '0.18' : '0.15') + ')');
            root.style.setProperty('--macos-accent-tint-hover', 'rgba(' + rgb + ', ' + (isDark ? '0.22' : '0.18') + ')');
            root.style.setProperty('--macos-accent-tint-active', 'rgba(' + rgb + ', ' + (isDark ? '0.28' : '0.26') + ')');
            root.style.setProperty('--f7-theme-color', hex);
            root.style.setProperty('--f7-theme-color-rgb', rgb);
            root.style.setProperty('--f7-theme-color-shade', hex);
            root.style.setProperty('--f7-toggle-active-color', hex);
            root.style.setProperty('--f7-button-fill-text-color', entry.on);

            var bootSnapshot = localStorage.getItem('contact_library_boot_palette');
            if (bootSnapshot) {
              var snap = JSON.parse(bootSnapshot);
              if (snap.canvas) root.style.setProperty('--macos-canvas-bg', snap.canvas);
              if (snap.card) root.style.setProperty('--macos-card-bg', snap.card);
              if (snap.sidebar) root.style.setProperty('--macos-sidebar-glass', snap.sidebar);
              if (snap.input) root.style.setProperty('--macos-input-bg', snap.input);
              if (snap.text) root.style.setProperty('--macos-text', snap.text);
              if (snap.canvas) root.style.setProperty('--f7-page-bg-color', snap.canvas);
            } else if (parsed.themeId === 'coffee') {
              var canvas = isDark ? '#1F1916' : '#FCF9F5';
              var card = isDark ? '#2E2420' : '#F7F2EB';
              var text = isDark ? '#E6D3C8' : '#3C2A21';
              var sidebar = isDark ? 'rgba(36, 28, 25, 0.90)' : 'rgba(214, 210, 196, 0.88)';
              var input = isDark ? '#3f322d' : '#EAE3CC';
              root.style.setProperty('--macos-canvas-bg', canvas);
              root.style.setProperty('--macos-card-bg', card);
              root.style.setProperty('--macos-sidebar-glass', sidebar);
              root.style.setProperty('--macos-input-bg', input);
              root.style.setProperty('--macos-text', text);
              root.style.setProperty('--f7-page-bg-color', canvas);
            }
          }
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --apple-font: 'Courier New', Courier, monospace;
        --f7-font-family: var(--apple-font);
        --macos-accent-color: #0056b8;
        --macos-accent-color-rgb: 0, 86, 184;
        --macos-on-accent: #ffffff;
        --macos-accent-gradient-end: #5336c7;
        --macos-accent-tint: rgba(0, 86, 184, 0.12);
        --macos-accent-tint-subtle: rgba(0, 86, 184, 0.08);
        --macos-accent-tint-status: rgba(0, 86, 184, 0.15);
        --macos-accent-tint-hover: rgba(0, 86, 184, 0.18);
        --macos-accent-tint-active: rgba(0, 86, 184, 0.26);
        --f7-theme-color: #0056b8;
        --f7-theme-color-rgb: 0, 86, 184;
        --f7-theme-color-shade: #0056b8;
        --f7-toggle-active-color: #0056b8;
        --f7-button-fill-text-color: #ffffff;
        --macos-canvas-bg: #f5f5f7;
        --macos-card-bg: #ffffff;
        --macos-modal-bg: #ffffff;
        --macos-input-bg: #ffffff;
        --macos-sidebar-glass: rgba(246, 246, 248, 0.82);
        --macos-toolbar-glass: rgba(255, 255, 255, 0.82);
        --macos-hover-bg: rgba(0, 0, 0, 0.04);
        --macos-active-bg: rgba(0, 0, 0, 0.07);
        --macos-subtle-bg: rgba(0, 0, 0, 0.03);
        --macos-text: #1c1c1e;
        --macos-text-secondary: #5c5c5e;
        --macos-text-muted: #666567;
        --macos-card-border: rgba(0, 0, 0, 0.08);
        --macos-hairline-border: rgba(0, 0, 0, 0.08);
        --macos-divider: rgba(0, 0, 0, 0.06);
        --macos-scrollbar-thumb: rgba(0, 0, 0, 0.16);
        --macos-scrollbar-thumb-hover: rgba(0, 0, 0, 0.28);
        --macos-danger-surface: rgba(255, 59, 48, 0.10);
        --macos-danger-border: rgba(255, 59, 48, 0.25);
        --f7-page-bg-color: #f5f5f7;
        --f7-card-bg-color: #ffffff;
      }
      ::selection {
        background-color: var(--macos-accent-color, #0056b8);
        color: var(--macos-on-accent, #ffffff);
      }
      * {
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--apple-font);
        user-select: none;
        -webkit-user-select: none;
      }
      button, input, select, textarea, kbd {
        font-family: var(--apple-font);
      }
      /* Scrollbars estilo macOS discretas */
      ::-webkit-scrollbar {
        width: 7px;
        height: 7px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--macos-scrollbar-thumb, rgba(0, 0, 0, 0.16));
        border-radius: 6px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--macos-scrollbar-thumb-hover, rgba(0, 0, 0, 0.28));
      }

      /* Respaldo inicial de Modo Oscuro en html (los estilos inline de AppProvider en :root tienen prioridad) */
      html.dark {
        --macos-canvas-bg: #18181a;
        --macos-card-bg: #212124;
        --macos-modal-bg: #242428;
        --macos-input-bg: #2b2b30;
        --macos-sidebar-glass: rgba(24, 24, 26, 0.96);
        --macos-toolbar-glass: rgba(24, 24, 26, 0.94);
        --macos-hover-bg: rgba(255, 255, 255, 0.06);
        --macos-active-bg: #323237;
        --macos-subtle-bg: rgba(255, 255, 255, 0.04);
        --macos-text: #ececef;
        --macos-text-secondary: #a4a4ab;
        --macos-text-muted: #888890;
        --macos-card-border: rgba(255, 255, 255, 0.07);
        --macos-hairline-border: rgba(255, 255, 255, 0.07);
        --macos-divider: rgba(255, 255, 255, 0.06);
        --macos-scrollbar-thumb: rgba(255, 255, 255, 0.18);
        --macos-scrollbar-thumb-hover: rgba(255, 255, 255, 0.32);
        --macos-danger-surface: rgba(255, 59, 48, 0.15);
        --macos-danger-border: rgba(255, 59, 48, 0.32);
        --f7-page-bg-color: #18181a;
        --f7-card-bg-color: #212124;
      }
      html.dark,
      body.dark {
        background-color: var(--macos-canvas-bg);
        color: var(--macos-text);
        color-scheme: dark;
      }
      .dark #root,
      .dark #app,
      .dark .view-main,
      .dark #content-view,
      .dark .page,
      .dark .page-content {
        background-color: var(--macos-canvas-bg) !important;
        color: var(--macos-text);
      }
      .dark .card {
        background-color: var(--macos-card-bg) !important;
        color: var(--macos-text) !important;
        border-color: var(--macos-card-border) !important;
      }
      .dark input,
      .dark select,
      .dark textarea {
        color-scheme: dark;
      }
      .dark select option {
        background-color: var(--macos-modal-bg);
        color: var(--macos-text);
      }
      .dark .popover,
      .dark .popover-inner,
      .dark .calendar,
      .dark .calendar-modal {
        background-color: var(--macos-modal-bg) !important;
        color: var(--macos-text) !important;
      }
      .dark .calendar-month-selector,
      .dark .calendar-year-selector,
      .dark .calendar-day {
        color: var(--macos-text) !important;
      }
      .dark .calendar-day.calendar-day-next,
      .dark .calendar-day.calendar-day-prev {
        color: var(--macos-text-muted) !important;
      }
      .dark .calendar-week-header {
        color: var(--macos-text-secondary) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/App.tsx"></script>
  </body>
</html>
