<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Library</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('contact_library_settings');
          if (saved) {
            var parsed = JSON.parse(saved);
            var map = {
              blue: '#007aff',
              purple: '#af52de',
              pink: '#ff2d55',
              red: '#ff3b30',
              orange: '#ff9500',
              green: '#34c759',
              graphite: '#8e8e93'
            };
            var hex = map[parsed.accentColor] || '#007aff';
            var clean = hex.replace('#', '');
            var r = parseInt(clean.substring(0, 2), 16);
            var g = parseInt(clean.substring(2, 4), 16);
            var b = parseInt(clean.substring(4, 6), 16);
            var rgb = r + ', ' + g + ', ' + b;
            var root = document.documentElement;
            root.style.setProperty('--macos-accent-color', hex);
            root.style.setProperty('--macos-accent-color-rgb', rgb);
            root.style.setProperty('--macos-accent-tint', 'rgba(' + rgb + ', 0.12)');
            root.style.setProperty('--macos-accent-tint-subtle', 'rgba(' + rgb + ', 0.08)');
            root.style.setProperty('--macos-accent-tint-status', 'rgba(' + rgb + ', 0.15)');
            root.style.setProperty('--macos-accent-tint-hover', 'rgba(' + rgb + ', 0.18)');
            root.style.setProperty('--macos-accent-tint-active', 'rgba(' + rgb + ', 0.26)');
            root.style.setProperty('--f7-theme-color', hex);
            root.style.setProperty('--f7-theme-color-rgb', rgb);
            root.style.setProperty('--f7-theme-color-shade', hex);
            root.style.setProperty('--f7-toggle-active-color', hex);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --apple-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "SF Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
        --macos-accent-color: #007aff;
        --macos-accent-color-rgb: 0, 122, 255;
        --macos-accent-tint: rgba(0, 122, 255, 0.12);
        --macos-accent-tint-subtle: rgba(0, 122, 255, 0.08);
        --macos-accent-tint-status: rgba(0, 122, 255, 0.15);
        --macos-accent-tint-hover: rgba(0, 122, 255, 0.18);
        --macos-accent-tint-active: rgba(0, 122, 255, 0.26);
        --f7-theme-color: #007aff;
        --f7-theme-color-rgb: 0, 122, 255;
        --f7-theme-color-shade: #007aff;
        --f7-toggle-active-color: #007aff;
        --macos-canvas-bg: #f5f5f7;
        --macos-card-bg: #ffffff;
        --macos-modal-bg: #ffffff;
        --macos-input-bg: #ffffff;
        --macos-text: #1c1c1e;
        --macos-text-secondary: #8e8e93;
        --macos-card-border: rgba(0, 0, 0, 0.08);
        --f7-page-bg-color: #f5f5f7;
        --f7-card-bg-color: #ffffff;
      }
      ::selection {
        background-color: var(--macos-accent-color, #007aff);
        color: #ffffff;
      }
      * {
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--apple-font);
        user-select: none;
        -webkit-user-select: none;
      }
      /* Scrollbars estilo macOS discretas */
      ::-webkit-scrollbar {
        width: 7px;
        height: 7px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.16);
        border-radius: 6px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.18);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.28);
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.32);
      }

      /* Soporte global de Modo Oscuro nativo de macOS */
      html.dark,
      body.dark {
        --macos-canvas-bg: #1e1e20;
        --macos-card-bg: rgba(38, 38, 42, 0.85);
        --macos-modal-bg: #242426;
        --macos-input-bg: rgba(255, 255, 255, 0.08);
        --macos-text: #ffffff;
        --macos-text-secondary: #8e8e93;
        --macos-card-border: rgba(255, 255, 255, 0.08);
        --f7-page-bg-color: #1e1e20;
        --f7-card-bg-color: rgba(38, 38, 42, 0.85);
        background-color: #1e1e20;
        color: #ffffff;
        color-scheme: dark;
      }
      .dark #root,
      .dark #app,
      .dark .view-main,
      .dark #content-view,
      .dark .page,
      .dark .page-content {
        background-color: #1e1e20 !important;
        color: #ffffff;
      }
      .dark .card {
        background-color: rgba(38, 38, 42, 0.85) !important;
        color: #ffffff !important;
        border-color: rgba(255, 255, 255, 0.08) !important;
      }
      .dark input,
      .dark select,
      .dark textarea {
        color-scheme: dark;
      }
      .dark select option {
        background-color: #242426;
        color: #ffffff;
      }
      .dark .popover,
      .dark .popover-inner,
      .dark .calendar,
      .dark .calendar-modal {
        background-color: #242426 !important;
        color: #ffffff !important;
      }
      .dark .calendar-month-selector,
      .dark .calendar-year-selector,
      .dark .calendar-day {
        color: #ffffff !important;
      }
      .dark .calendar-day.calendar-day-next,
      .dark .calendar-day.calendar-day-prev {
        color: rgba(255, 255, 255, 0.3) !important;
      }
      .dark .calendar-week-header {
        color: #8e8e93 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/App.tsx"></script>
  </body>
</html>
